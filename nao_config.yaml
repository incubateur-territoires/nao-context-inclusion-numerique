project_name: inclusion-numerique
databases:
  - name: postgres-inclusion-numerique
    type: postgres
    host: "{{ env('NAO_DB_HOST') }}"
    port: "{{ env('NAO_DB_PORT') }}"
    database: "{{ env('NAO_DB_NAME') }}"
    user: "{{ env('NAO_DB_USER') }}"
    password: "{{ env('NAO_DB_PASSWORD') }}"
    # Périmètre = exactement ce que le rôle Postgres `nao_ro` peut lire.
    # La confidentialité est garantie EN BASE (vues llm.*, révocations, cf.
    # migrations V102/V103/V172/V173 du dépôt dataspace) : cette liste ne fait
    # que la refléter. Toute table ajoutée ici sans grant côté base sera
    # simplement vide au sync ; tout grant ajouté côté base doit être reporté
    # ici pour entrer dans le contexte de l'agent.
    include:
      # Vues curées sans donnée nominative (schéma dédié à l'agent)
      - llm.*
      # Référentiels territoriaux et nomenclatures
      - admin.*
      - reference.*
      # Entrepôt : tables pseudonymisées (identifiants techniques, pas de nominatif)
      - main.activites_coop
      - main.adresse
      - main.contact_structure_administrative
      - main.contrat
      - main.formation
      - main.personne_affectations_emploi
      - main.personne_affectations_lieu
      - main.poste
      - main.subvention
      # Application MIN : gouvernance, pilotage FNE, référentiels
      - min.action
      - min.beneficiaire_subvention
      - min.co_financement
      - min.comite
      - min.demande_de_subvention
      - min.departement
      - min.departement_enveloppe
      - min.enveloppe_financement
      - min.feuille_de_route
      - min.groupement
      - min.porteur_action
      - min.postes_conseiller_numerique_synthese
      - min.region
    exclude:
      # Table gelée (V151), doublon historique de main.personne_affectations_lieu
      - main.personne_affectations_lieu_legacy
    # Les tables synchronisées deviennent une frontière dure à l'exécution :
    # aucune requête (générée ou saisie) hors de cette liste.
    allow_listed_only: true
    # `columns` seulement : pas d'échantillon de lignes (`preview`) ni de
    # statistiques (`profiling`) versionnés dans ce dépôt.
    templates:
      - columns
repos:
  - name: data-space-scripts
    url: https://gitlab.com/incubateur-territoires/startups/data-space-societe-numerique/scripts.git
    branch: main
    include:
      - "README.md"
      - "CHANGELOG.md"
      - "CHANGELOG-metier.md"
      - "docs/**"
      - "database/migrations/V*.sql"
      - "*-dag.py"
      - "schema-idPoste.py"
      - "opendata.py"
      - "etl/**/*.py"
    exclude:
      - "**/__pycache__/**"
      - "**/*.pyc"
      - "**/.pytest_cache/**"
      # Documents de travail contenant des courriels de personnes
      - "docs/refonte-structure-plan.md"
      - "docs/CONTACT_MERGE.md"
  - name: suite-gestionnaire-numerique
    url: https://github.com/anct-cnum/suite-gestionnaire-numerique.git
    branch: main
    include:
      - "README.md"
      - "docs/**"
      - "prisma/schema.prisma"
      - "prisma/views/**"
    exclude:
      - "**/.env*"
      - "prisma/migrations/**"
      - "**/node_modules/**"
notion: null
llm: null
slack: null
