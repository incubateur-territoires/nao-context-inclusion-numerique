name: tdb_e_actions
prompt: "Combien d'actions sont enregistrées dans les feuilles de route de MIN, toutes gouvernances confondues ? Exclure les feuilles de route de la gouvernance technique « zzz »."
kind: scalar
tags: [tableau-de-bord, E]
sql: |
  SELECT count(*) AS n
  FROM min.action a
  JOIN min.feuille_de_route f ON f.id = a.feuille_de_route_id
  WHERE f.gouvernance_departement_code <> 'zzz'
