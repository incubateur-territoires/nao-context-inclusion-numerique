name: tdb_s_durees
prompt: "Sur la page Statistiques de MIN au niveau national, donne la répartition des accompagnements par durée d'activité en quatre tranches avec exactement ces libellés : « Moins de 30 min » (durée < 30), « 30min à 1 h » (30 ≤ durée < 60), « 1 h à 2 h » (60 ≤ durée < 120), « 2 h et plus » (durée ≥ 120). Durée en minutes ; les activités sans durée renseignée n'entrent dans aucune tranche. Pour chaque tranche, le nombre = somme du nombre d'accompagnements des activités de la tranche. Période de référence de la page Statistiques : du 17/11/2020 (début du dispositif) à aujourd'hui inclus (date de l'activité). Seules les activités Coop non supprimées comptent. Les valeurs évoluent chaque jour, une tolérance de 1 % est admise."
kind: table
rtol: 0.01
tags: [tableau-de-bord, S]
sql: |
  SELECT CASE WHEN act.duree < 30 THEN 'Moins de 30 min'
              WHEN act.duree < 60 THEN '30min à 1 h'
              WHEN act.duree < 120 THEN '1 h à 2 h'
              ELSE '2 h et plus' END AS tranche,
         SUM(act.accompagnements_count)::bigint AS n
  FROM llm.coop_activites act
  WHERE act.suppression IS NULL AND act.date::date >= DATE '2020-11-17' AND act.date::date <= CURRENT_DATE
    AND act.duree IS NOT NULL AND act.duree >= 0
  GROUP BY 1 ORDER BY min(act.duree)
