name: tdb_c_ifn_top10_departements
prompt: "Quels sont les 10 départements dont l'indice de fragilité numérique (IFN départemental, données Mednum) est le plus élevé ? Donne un tableau nom du département / score arrondi à 2 décimales, du plus fragile au moins fragile."
kind: table
tags: [tableau-de-bord, C]
sql: |
  SELECT d.nom AS departement, round(i.score::numeric, 2) AS score
  FROM admin.ifn_departement i
  JOIN admin.departement d ON d.code = i.code
  ORDER BY i.score DESC, d.nom
  LIMIT 10
