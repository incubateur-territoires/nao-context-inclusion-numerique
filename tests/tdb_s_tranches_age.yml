name: tdb_s_tranches_age
prompt: "Sur la page Statistiques de MIN au niveau national, donne la répartition par tranche d'âge des bénéficiaires accompagnés : nombre de fiches bénéficiaire distinctes rattachées à au moins un accompagnement d'une activité Coop non supprimée, par tranche d'âge dérivée (calculée depuis l'année de naissance quand elle est plausible, sinon la tranche déclarée), avec les identifiants enregistrés : moins_de_douze, douze_dix_huit, dix_huit_vingt_quatre, vingt_cinq_trente_neuf, quarante_cinquante_neuf, soixante_soixante_neuf, soixante_dix_plus, non_communique (les fiches sans tranche comptent dans non_communique). Période de référence de la page Statistiques : du 17/11/2020 (début du dispositif) à aujourd'hui inclus (date de l'activité). Tableau identifiant de tranche / nombre. Les valeurs évoluent chaque jour, une tolérance de 1 % est admise."
kind: table
rtol: 0.01
tags: [tableau-de-bord, S, lourd]
sql: |
  SELECT COALESCE(ben.tranche_age_derivee, 'non_communique') AS tranche_age, count(DISTINCT ben.id) AS n

  FROM llm.coop_activites act
  JOIN llm.coop_accompagnements acc ON acc.activite_id = act.id
  JOIN llm.coop_beneficiaires ben ON ben.id = acc.beneficiaire_id
  WHERE act.suppression IS NULL AND act.date::date >= DATE '2020-11-17' AND act.date::date <= CURRENT_DATE
  GROUP BY 1 ORDER BY 2 DESC
