name: tdb_i_collectivites_par_categorie
prompt: "Sur la page d'administration des gouvernances de MIN, les « collectivités impliquées dans la gouvernance » sont les structures distinctes (une structure membre de plusieurs gouvernances compte une fois) membres confirmées et non supprimées d'au moins une gouvernance, dont la catégorie juridique INSEE est celle d'une collectivité : commune (7210), département (7220), région ou collectivité à statut particulier (7229, 7230), EPCI à fiscalité propre (7343, 7344, 7346, 7347, 7348). Les services de l'État (préfectures, catégories 71xx) n'en font pas partie. Donne leur ventilation en catégories : « EPCI », « Communes », « Conseils départementaux », « Régions et collectivités à statut particulier ». Tableau catégorie / nombre de structures."
kind: table
tags: [tableau-de-bord, I]
sql: |
  WITH s AS (
    SELECT m.structure_id, max(sa.categorie_juridique) AS cj
    FROM llm.membre m
    JOIN llm.structure_administrative sa ON sa.id = m.structure_id
    WHERE m.statut = 'confirme' AND m.date_suppression IS NULL
    GROUP BY m.structure_id)
  SELECT CASE
           WHEN cj IN ('7343', '7344', '7346', '7347', '7348') THEN 'EPCI'
           WHEN cj = '7210' THEN 'Communes'
           WHEN cj = '7220' THEN 'Conseils départementaux'
           ELSE 'Régions et collectivités à statut particulier' END AS categorie,
         count(*) AS n
  FROM s
  WHERE cj IN ('7210', '7220', '7229', '7230', '7343', '7344', '7346', '7347', '7348')
  GROUP BY 1 ORDER BY 2 DESC
