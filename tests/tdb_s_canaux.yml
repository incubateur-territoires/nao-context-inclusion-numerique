name: tdb_s_canaux
prompt: "Sur la page Statistiques de MIN au niveau national, donne la répartition des accompagnements par canal (type de lieu de l'activité) avec exactement ces libellés : « Lieu d'activité », « Autre lieu », « À domicile », « À distance ». Pour chaque canal, le nombre = somme du nombre d'accompagnements des activités de ce canal. Période de référence de la page Statistiques : du 17/11/2020 (début du dispositif) à aujourd'hui inclus (date de l'activité). Seules les activités Coop non supprimées comptent. Les valeurs évoluent chaque jour, une tolérance de 1 % est admise."
kind: table
rtol: 0.01
tags: [tableau-de-bord, S]
sql: |
  SELECT CASE act.type_lieu
           WHEN 'lieu_activite' THEN 'Lieu d''activité'
           WHEN 'autre' THEN 'Autre lieu'
           WHEN 'domicile' THEN 'À domicile'
           WHEN 'a_distance' THEN 'À distance' END AS canal,
         SUM(act.accompagnements_count)::bigint AS n
  FROM llm.coop_activites act
  WHERE act.suppression IS NULL AND act.date::date >= DATE '2020-11-17' AND act.date::date <= CURRENT_DATE
    AND act.type_lieu IN ('lieu_activite', 'autre', 'domicile', 'a_distance')
  GROUP BY 1 ORDER BY 2 DESC
