name: tdb_i_feuilles_de_route_avec_demandes__courte
prompt: "Combien de feuilles de route ont au moins une demande de subvention ?"
kind: scalar
rtol: 0.005
tags: [variante, courte, I]
sql: |
  SELECT count(*) AS n
  FROM min.feuille_de_route f
  WHERE EXISTS (SELECT 1 FROM min.action a
                JOIN min.demande_de_subvention d ON d.action_id = a.id
                WHERE a.feuille_de_route_id = f.id)
