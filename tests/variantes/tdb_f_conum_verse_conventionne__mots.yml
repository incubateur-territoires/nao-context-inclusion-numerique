name: tdb_f_conum_verse_conventionne__mots
prompt: "D'après la synthèse des postes Conseiller numérique, total national des subventions cumulées (conventionné) et des versements cumulés (versé) : tableau à deux lignes « conventionné » et « versé », montants en euros."
kind: table
rtol: 0.005
tags: [variante, mots, F]
sql: |
  SELECT 'conventionné' AS indicateur, COALESCE(SUM(v.montant_subvention_cumule), 0)::bigint AS montant
    FROM min.postes_conseiller_numerique_synthese v
  UNION ALL
  SELECT 'versé', COALESCE(SUM(v.montant_versement_cumule), 0)::bigint
    FROM min.postes_conseiller_numerique_synthese v
