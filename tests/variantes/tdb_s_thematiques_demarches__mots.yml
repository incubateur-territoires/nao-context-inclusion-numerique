name: tdb_s_thematiques_demarches__mots
prompt: "Page Statistiques, national : pour chaque thématique de démarches administratives (identifiants enregistrés : papiers_elections_citoyennete, famille_scolarite, social_sante, travail_formation, logement, transports_mobilite, argent_impots, justice, etrangers_europe, loisirs_sports_culture, associations), somme des accompagnements des activités concernées, multi-thématiques comptées dans chacune, depuis le 17/11/2020, non supprimées. Tableau identifiant / nombre décroissant. Tolérance 1 %."
kind: table
rtol: 0.01
tags: [variante, mots, S]
sql: |
  SELECT th AS thematique, SUM(act.accompagnements_count)::bigint AS n
  FROM llm.coop_activites act, unnest(act.thematiques) AS th
  WHERE act.suppression IS NULL AND act.date::date >= DATE '2020-11-17' AND act.date::date <= CURRENT_DATE
    AND th IN ('papiers_elections_citoyennete','famille_scolarite','social_sante','travail_formation','logement','transports_mobilite','argent_impots','justice','etrangers_europe','loisirs_sports_culture','associations')
  GROUP BY 1 ORDER BY 2 DESC
