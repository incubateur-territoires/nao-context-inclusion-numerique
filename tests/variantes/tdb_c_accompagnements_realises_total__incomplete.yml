name: tdb_c_accompagnements_realises_total__incomplete
prompt: "Au niveau national, quel est le nombre total d'accompagnements réalisés, tous dispositifs confondus, selon le bloc « État des lieux » du tableau de bord MIN ?"
kind: scalar
rtol: 0.005
tags: [variante, incomplete, C]
sql: |
  SELECT (SELECT COALESCE(SUM(pe.nb_accompagnements_ac), 0)
            FROM llm.personne_enrichie pe
           WHERE pe.type_accompagnateur = 'aidant_numerique')
       + (SELECT COALESCE(SUM(a.accompagnements_count), 0)
            FROM llm.coop_activites a
           WHERE a.suppression IS NULL) AS n
