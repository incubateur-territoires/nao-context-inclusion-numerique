name: tdb_i_gouvernances_sans_coporteur__mots
prompt: "Sur la page d'administration des gouvernances, nombre de gouvernances dont le seul coporteur est la préfecture (un unique membre coporteur), tous membres comptés quel que soit leur statut, supprimés inclus."
kind: scalar
rtol: 0.005
tags: [variante, mots, I]
sql: |
  SELECT count(*) AS n FROM (
    SELECT g.departement_code
    FROM llm.gouvernance g
    LEFT JOIN llm.membre m ON m.gouvernance_departement_code = g.departement_code AND m.is_coporteur = true
    GROUP BY 1 HAVING count(m.id) = 1) t
