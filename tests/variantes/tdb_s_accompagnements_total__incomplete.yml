name: tdb_s_accompagnements_total__incomplete
prompt: "Sur la page Statistiques de MIN au niveau national, quel est le nombre total d'accompagnements ? Tolérance 1 %."
kind: scalar
rtol: 0.01
tags: [variante, incomplete, S]
sql: |
  SELECT COALESCE(SUM(act.accompagnements_count), 0)::bigint AS n
  FROM llm.coop_activites act
  WHERE act.suppression IS NULL AND act.date::date >= DATE '2020-11-17' AND act.date::date <= CURRENT_DATE
