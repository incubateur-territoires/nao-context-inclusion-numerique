name: tdb_a_lieux_a_actualiser__mots
prompt: "Nombre de lieux d'inclusion numérique actifs dont la fiche n'a pas été modifiée depuis plus de 18 mois (ou jamais), en France entière. Un mois vaut 30,44 jours ; 1 % de tolérance."
kind: scalar
rtol: 0.01
tags: [variante, mots, A]
sql: |
  SELECT count(*) AS n
  FROM llm.lieu_inclusion l
  WHERE l.deleted_at IS NULL
    AND (l.updated_at IS NULL OR l.updated_at <= now() - interval '548 days')
