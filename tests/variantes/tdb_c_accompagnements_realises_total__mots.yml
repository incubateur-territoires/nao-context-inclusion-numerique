name: tdb_c_accompagnements_realises_total__mots
prompt: "Indicateur « accompagnements réalisés » du bloc État des lieux, national : accompagnements des aidants numériques (Aidants Connect) additionnés aux accompagnements de toutes les activités Coop non supprimées, sans borne de date. Chiffre exact."
kind: scalar
rtol: 0.005
tags: [variante, mots, C]
sql: |
  SELECT (SELECT COALESCE(SUM(pe.nb_accompagnements_ac), 0)
            FROM llm.personne_enrichie pe
           WHERE pe.type_accompagnateur = 'aidant_numerique')
       + (SELECT COALESCE(SUM(a.accompagnements_count), 0)
            FROM llm.coop_activites a
           WHERE a.suppression IS NULL) AS n
