name: tdb_a_lieux_a_actualiser__courte
prompt: "Combien de lieux sont à actualiser sur le tableau de bord ?"
kind: scalar
rtol: 0.01
tags: [variante, courte, A]
sql: |
  SELECT count(*) AS n
  FROM llm.lieu_inclusion l
  WHERE l.deleted_at IS NULL
    AND (l.updated_at IS NULL OR l.updated_at <= now() - interval '548 days')
