name: tdb_i_feuilles_de_route_par_perimetre__mots
prompt: "Répartition des feuilles de route selon leur échelle territoriale : « départemental », « infra-départemental » (groupements de communes), « régional », « Autre » quand le périmètre est vide. Une ligne par libellé avec le compte."
kind: table
rtol: 0.005
tags: [variante, mots, I]
sql: |
  SELECT CASE perimetre_geographique
           WHEN 'departemental' THEN 'départemental'
           WHEN 'groupementsDeCommunes' THEN 'infra-départemental'
           WHEN 'regional' THEN 'régional'
           ELSE 'Autre' END AS perimetre,
         count(*) AS n
  FROM min.feuille_de_route
  GROUP BY 1 ORDER BY 2 DESC
