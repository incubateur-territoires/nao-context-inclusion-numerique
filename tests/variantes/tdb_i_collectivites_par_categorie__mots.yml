name: tdb_i_collectivites_par_categorie__mots
prompt: "Page d'administration des gouvernances : nombre de membres collectivités, tous statuts y compris supprimés, selon les types retenus par la page (communes, EPCI et intercommunalités, collectivités territoriales, conseils départementaux, régions, préfectures). Tableau avec les catégories Conseils départementaux / Conseils régionaux / EPCI / Communes / Autres."
kind: table
rtol: 0.005
tags: [variante, mots, I]
sql: |
  SELECT CASE
           WHEN type = 'Conseil départemental' THEN 'Conseils départementaux'
           WHEN type = 'Région' THEN 'Conseils régionaux'
           WHEN type IN ('EPCI', 'Collectivité, EPCI', 'Collectivité, intercommunalité') THEN 'EPCI'
           WHEN type IN ('Commune', 'Collectivité, commune') THEN 'Communes'
           ELSE 'Autres' END AS categorie,
         count(*) AS n
  FROM llm.membre
  WHERE type IN ('Collectivité, commune', 'Collectivité, EPCI', 'Collectivité, intercommunalité', 'Collectivité territoriale', 'Commune', 'Conseil départemental', 'EPCI', 'Préfecture départementale', 'Préfecture régionale', 'Région')
  GROUP BY 1 ORDER BY 2 DESC
