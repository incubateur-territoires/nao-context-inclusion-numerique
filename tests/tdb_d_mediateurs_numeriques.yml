name: tdb_d_mediateurs_numeriques
prompt: "Au niveau national, combien de médiateurs numériques sont actuellement en poste ? (indicateur « Médiateurs numériques » du bloc « Médiateurs numériques et Aidants Connect » du tableau de bord MIN)"
kind: scalar
tags: [tableau-de-bord, D]
sql: |
  SELECT count(*) AS n
  FROM llm.personne_enrichie
  WHERE est_actuellement_mediateur_en_poste = true
