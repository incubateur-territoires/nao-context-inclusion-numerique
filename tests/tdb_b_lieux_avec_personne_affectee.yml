name: tdb_b_lieux_avec_personne_affectee
prompt: "Combien de lieux d'inclusion numérique distincts ont au moins une personne (médiateur ou aidant) actuellement affectée à ce lieu, c'est-à-dire avec une affectation au lieu encore active ? Compter tous les lieux, y compris ceux marqués supprimés (c'est la règle du bloc « Données structure » du tableau de bord MIN)."
kind: scalar
tags: [tableau-de-bord, B]
sql: |
  SELECT count(DISTINCT pal.lieu_id) AS n
  FROM main.personne_affectations_lieu pal
  WHERE pal.est_active = true
