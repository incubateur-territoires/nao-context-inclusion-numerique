name: tdb_f_fne_par_enveloppe
prompt: "Donne la ventilation par enveloppe de financement du montant des financements France Numérique Ensemble engagés par l'État : pour chaque enveloppe, la somme en euros des subventions demandées des demandes « acceptée » rattachées à une action d'une feuille de route. Règle du tableau de bord MIN : toute enveloppe compte, quel que soit son libellé, dès lors qu'elle n'est pas une enveloppe « Conseiller Numérique » (ne pas filtrer sur les mots « France Numérique Ensemble »). Tableau libellé complet de l'enveloppe / montant exact en euros."
kind: table
tags: [tableau-de-bord, F]
sql: |
  WITH demandes AS (
    SELECT d.subvention_demandee, e.libelle AS enveloppe_libelle, e.montant AS enveloppe_montant
    FROM min.demande_de_subvention d
    JOIN min.action a ON a.id = d.action_id
    JOIN min.feuille_de_route f ON f.id = a.feuille_de_route_id
    JOIN min.enveloppe_financement e ON e.id = d.enveloppe_financement_id
    WHERE d.statut = 'acceptee')
  
  SELECT enveloppe_libelle AS enveloppe, SUM(subvention_demandee)::bigint AS montant
  FROM demandes GROUP BY 1 ORDER BY 1
