name: tdb_i_feuilles_de_route_par_perimetre
prompt: "Donne la répartition des feuilles de route par périmètre géographique, sous forme de tableau avec exactement ces libellés : « départemental », « infra-départemental » (périmètre « groupements de communes »), « régional », et « Autre » si le périmètre n'est pas renseigné. Une ligne par libellé avec le nombre de feuilles de route."
kind: table
tags: [tableau-de-bord, I]
sql: |
  SELECT CASE perimetre_geographique
           WHEN 'departemental' THEN 'départemental'
           WHEN 'groupementsDeCommunes' THEN 'infra-départemental'
           WHEN 'regional' THEN 'régional'
           ELSE 'Autre' END AS perimetre,
         count(*) AS n
  FROM min.feuille_de_route
  GROUP BY 1 ORDER BY 2 DESC
